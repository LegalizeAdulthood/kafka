name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{matrix.os}}
    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
      with:
        submodules: true

    - name: Update Dependencies
      if: ${{matrix.os == 'macos-latest'}}
      run: |
        brew install flex bison
        (echo /opt/homebrew/opt/flex/bin; echo /opt/homebrew/opt/bison/bin) >> $GITHUB_PATH

    - name: Run Workflow
      run: cmake --workflow --preset default
